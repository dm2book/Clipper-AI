[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-sniper"
version = "0.1.0"
description = "Detects new Solana token launches, screens them, and trades with strict risk limits."
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
    "PyYAML>=6,<7",
    "solders>=0.21,<1",
    "websockets>=12,<18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
sniper = "sniper.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
