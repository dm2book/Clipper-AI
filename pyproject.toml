[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.1.0"
description = "Turn long-form content into short-form vertical clips."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The engine runs on heuristics alone with no dependencies. The LLM tier is
# opt-in, which is what keeps the test suite offline and hermetic.
llm = ["anthropic>=0.60"]
# Persistence. psycopg is the only client the store needs; the pool is
# separate because a single-worker deployment does not need one.
db = ["psycopg[binary]>=3.2", "psycopg_pool>=3.2"]
# Source acquisition. The HTTP downloader, the ISO container reader and the
# feed parser are all standard library on purpose — this is only for YouTube,
# which needs an extractor nobody sensible writes themselves.
#
# ffmpeg is *not* a Python dependency. It is optional and found on PATH (or
# via CLIPFORGE_FFMPEG); without it, thumbnails degrade to embedded artwork
# only and non-ISO containers cannot be measured.
acquire = ["yt-dlp>=2024.1"]
# Authentication. Both are hard requirements of the auth package and there is
# deliberately no pure-Python fallback for either: a weaker password hash that
# activates when a dependency is missing is a weaker hash nobody notices.
auth = ["bcrypt>=4.1", "PyJWT>=2.8"]
# Transcription. faster-whisper for local inference; the OpenAI-compatible
# provider needs nothing beyond the standard library. pocketsphinx is the
# offline smoke-test recogniser the suite uses and is not a production choice.
transcribe = ["faster-whisper>=1.0"]
transcribe-offline = ["pocketsphinx>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
