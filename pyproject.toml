[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.1.0"
description = "Turn long-form content into short-form vertical clips."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The engine runs on heuristics alone with no dependencies. The LLM tier is
# opt-in, which is what keeps the test suite offline and hermetic.
llm = ["anthropic>=0.60"]
# Persistence. psycopg is the only client the store needs; the pool is
# separate because a single-worker deployment does not need one.
db = ["psycopg[binary]>=3.2", "psycopg_pool>=3.2"]
# Source acquisition. The HTTP downloader, the ISO container reader and the
# feed parser are all standard library on purpose — this is only for YouTube,
# which needs an extractor nobody sensible writes themselves.
#
# ffmpeg is *not* a Python dependency. It is optional and found on PATH (or
# via CLIPFORGE_FFMPEG); without it, thumbnails degrade to embedded artwork
# only and non-ISO containers cannot be measured.
acquire = ["yt-dlp>=2024.1"]
# Authentication. Both are hard requirements of the auth package and there is
# deliberately no pure-Python fallback for either: a weaker password hash that
# activates when a dependency is missing is a weaker hash nobody notices.
auth = ["bcrypt>=4.1", "PyJWT>=2.8"]
# The HTTP API. starlette is pinned below 0.50 because FastAPI 0.141 does not
# support the 1.x line, and the incompatibility is silent — routers register
# without error and serve nothing.
api = ["fastapi>=0.115,<0.142", "starlette>=0.46,<0.50", "uvicorn>=0.30"]
# Durable media storage. boto3 rather than a hand-written SigV4 signer: it is
# what Cloudflare's own R2 documentation points at, and it brings multipart,
# presigning and connection reuse with it.
storage = ["boto3>=1.34"]
# Transcription. faster-whisper for local inference; the OpenAI-compatible
# provider needs nothing beyond the standard library. pocketsphinx is the
# offline smoke-test recogniser the suite uses and is not a production choice.
transcribe = ["faster-whisper>=1.0"]
transcribe-offline = ["pocketsphinx>=5.0"]
# Face detection for automatic framing. The headless wheel, because nothing
# here opens a window and the GUI build drags in GTK for no benefit in a
# container. The YuNet weights ship inside the package (227 KB, MIT) rather
# than being fetched at runtime — see src/clipforge/vision/models/NOTICE.md.
#
# numpy arrives with OpenCV anyway, but it is named because `vision` imports
# it directly, and an implicit dependency is one nobody knows they can break.
vision = ["opencv-python-headless>=4.8", "numpy>=1.24"]

[project.scripts]
clipforge-api = "clipforge.api.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# The face model is data, not code, so `packages.find` does not pick it up.
# Without this a `pip install .` produces a package whose detector cannot
# start, and `vision.config.resolve_model` says exactly that — but the repair
# is here rather than at the deployment.
[tool.setuptools.package-data]
"clipforge.vision" = ["models/*.onnx", "models/NOTICE.md"]
