[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.1.0"
description = "Turn long-form content into short-form vertical clips."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The engine runs on heuristics alone with no dependencies. The LLM tier is
# opt-in, which is what keeps the test suite offline and hermetic.
llm = ["anthropic>=0.60"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
